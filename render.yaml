services:
  - type: web
    name: enfance-plus-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: enfance_plus
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: EMAIL_MODE
        value: smtp
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SETUP_CODE
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: EMERGENT_LLM_KEY
        sync: false

  - type: web
    name: enfance-plus
    runtime: static
    buildCommand: cd frontend && yarn install && yarn build
    staticPublishPath: frontend/build
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_BACKEND_URL
        sync: false
