services:
  - type: web
    name: enfance-plus-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: enfance_plus
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "^https://([a-z0-9-]+\\.)*onrender\\.com$"
      - key: AUTH_ENABLED
        value: "true"
      - key: EMAIL_MODE
        value: simulated
      - key: SEED_DEMO
        value: "false"
      - key: EMERGENT_LLM_KEY
        sync: false

  - type: web
    name: enfance-plus
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: build
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REACT_APP_BACKEND_URL
        sync: false
